<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard — Axditra</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/js/supabase-client.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #0b0c0e;
      color: #f5f5f5;
      font-family: Arial, Helvetica, sans-serif;
    }

    .container {
      width: min(1100px, calc(100% - 40px));
      margin: 0 auto;
    }

    nav {
      height: 76px;
      border-bottom: 1px solid #202328;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    .logo span {
      color: #d7fe03;
    }

    .nav-right {
      display: flex;
      align-items: center;
      gap: 18px;
    }

    #userEmail {
      color: #8f969f;
      font-size: 14px;
    }

    button {
      border: 0;
      cursor: pointer;
      font: inherit;
    }

    .logout {
      padding: 9px 15px;
      border: 1px solid #30343a;
      border-radius: 8px;
      background: transparent;
      color: #fff;
    }

    .logout:hover {
      background: #17191d;
    }

    main {
      padding: 55px 0 80px;
    }

    .header {
      margin-bottom: 35px;
    }

    .eyebrow {
      color: #d7fe03;
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      margin-bottom: 10px;
    }

    h1 {
      margin: 0;
      font-size: clamp(34px, 5vw, 54px);
      letter-spacing: -2px;
    }

    .subtitle {
      margin-top: 12px;
      color: #8f969f;
      font-size: 16px;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      margin-bottom: 45px;
    }

    .stat {
      padding: 24px;
      background: #111316;
      border: 1px solid #22262b;
      border-radius: 14px;
    }

    .stat-label {
      color: #858c94;
      font-size: 13px;
      margin-bottom: 10px;
    }

    .stat-value {
      font-size: 32px;
      font-weight: 700;
    }

    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 15px;
    }

    h2 {
      margin: 0;
      font-size: 22px;
    }

    .refresh {
      padding: 8px 13px;
      border-radius: 7px;
      background: #17191d;
      color: #fff;
      border: 1px solid #30343a;
    }

    .refresh:hover {
      border-color: #d7fe03;
    }

    .table-wrap {
      overflow-x: auto;
      background: #111316;
      border: 1px solid #22262b;
      border-radius: 14px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th,
    td {
      padding: 17px 18px;
      text-align: left;
      border-bottom: 1px solid #202328;
    }

    th {
      color: #777f88;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    td {
      font-size: 14px;
    }

    tr:last-child td {
      border-bottom: 0;
    }

    .url {
      max-width: 380px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .score {
      font-weight: 700;
    }

    .view-btn {
      background: transparent;
      color: #d7fe03;
      font-weight: 600;
    }

    .view-btn:hover {
      text-decoration: underline;
    }

    .empty {
      padding: 55px 20px;
      text-align: center;
      color: #777f88;
    }

    .loading {
      padding: 45px;
      text-align: center;
      color: #777f88;
    }

    .error {
      margin-bottom: 20px;
      padding: 14px 16px;
      background: #291b1b;
      border: 1px solid #593030;
      border-radius: 9px;
      color: #ffb3b3;
      display: none;
    }

    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.78);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 100;
    }

    .modal.active {
      display: flex;
    }

    .modal-box {
      width: min(800px, 100%);
      max-height: 85vh;
      overflow-y: auto;
      background: #111316;
      border: 1px solid #30343a;
      border-radius: 16px;
      padding: 28px;
    }

    .modal-top {
      display: flex;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 25px;
    }

    .close {
      background: transparent;
      color: #888;
      font-size: 24px;
    }

    .close:hover {
      color: #fff;
    }

    .report-url {
      color: #8f969f;
      word-break: break-all;
      margin-top: 8px;
    }

    .report-score {
      font-size: 42px;
      font-weight: 700;
      color: #d7fe03;
    }

    .issue {
      margin-top: 15px;
      padding: 17px;
      border: 1px solid #25292e;
      border-radius: 10px;
      background: #0c0e10;
    }

    .issue-title {
      font-weight: 700;
      margin-bottom: 6px;
    }

    .issue-impact {
      color: #aeb4bb;
      font-size: 13px;
      margin-bottom: 8px;
    }

    .issue-description {
      color: #8f969f;
      font-size: 14px;
      line-height: 1.6;
    }

    @media (max-width: 700px) {
      .stats {
        grid-template-columns: 1fr;
      }

      #userEmail {
        display: none;
      }

      th:nth-child(3),
      td:nth-child(3) {
        display: none;
      }
    }
  </style>
</head>

<body>

  <nav>
    <div class="container" style="display:flex;align-items:center;justify-content:space-between;width:100%;">
      <div class="logo">Axditra<span>.</span></div>

      <div class="nav-right">
        <span id="userEmail"></span>
        <button class="logout" id="logoutBtn">Log out</button>
      </div>
    </div>
  </nav>

  <main>
    <div class="container">

      <div class="header">
        <div class="eyebrow">Dashboard</div>
        <h1>Your accessibility history.</h1>
        <div class="subtitle">
          Every scan you run is saved here.
        </div>
      </div>

      <div id="errorBox" class="error"></div>

      <section class="stats">
        <div class="stat">
          <div class="stat-label">Total scans</div>
          <div class="stat-value" id="totalScans">—</div>
        </div>

        <div class="stat">
          <div class="stat-label">Average score</div>
          <div class="stat-value" id="averageScore">—</div>
        </div>

        <div class="stat">
          <div class="stat-label">Issues found</div>
          <div class="stat-value" id="totalIssues">—</div>
        </div>
      </section>

      <section>
        <div class="section-header">
          <h2>Recent scans</h2>
          <button class="refresh" id="refreshBtn">Refresh</button>
        </div>

        <div class="table-wrap">
          <div id="loading" class="loading">Loading your scans...</div>

          <table id="scanTable" style="display:none;">
            <thead>
              <tr>
                <th>Website</th>
                <th>Score</th>
                <th>Issues</th>
                <th>Date</th>
                <th></th>
              </tr>
            </thead>

            <tbody id="scanBody"></tbody>
          </table>

          <div id="empty" class="empty" style="display:none;">
            No scans yet. Run your first accessibility audit.
          </div>
        </div>
      </section>

    </div>
  </main>

  <div class="modal" id="modal">
    <div class="modal-box">

      <div class="modal-top">
        <div>
          <h2>Scan report</h2>
          <div class="report-url" id="reportUrl"></div>
        </div>

        <button class="close" id="closeModal">×</button>
      </div>

      <div class="report-score" id="reportScore"></div>

      <div id="reportIssues"></div>

    </div>
  </div>

<script>
  let authData = null;

  async function apiRequest(url, options = {}) {
    const { session } = authData;

    const headers = {
      ...(options.headers || {}),
      Authorization: `Bearer ${session.access_token}`,
      'Content-Type': 'application/json'
    };

    return fetch(url, {
      ...options,
      headers
    });
  }

  function showError(message) {
    const box = document.getElementById('errorBox');
    box.textContent = message;
    box.style.display = 'block';
  }

  function clearError() {
    document.getElementById('errorBox').style.display = 'none';
  }

  function formatDate(date) {
    return new Date(date).toLocaleDateString(undefined, {
      year: 'numeric',
      month: 'short',
      day: 'numeric'
    });
  }

  async function loadScans() {
    clearError();

    const loading = document.getElementById('loading');
    const table = document.getElementById('scanTable');
    const empty = document.getElementById('empty');

    loading.style.display = 'block';
    table.style.display = 'none';
    empty.style.display = 'none';

    try {
      const response = await apiRequest('/api/scans');
      const data = await response.json();

      if (!response.ok) {
        throw new Error(data.error || 'Could not load scans.');
      }

      const scans = data.scans || [];

      document.getElementById('totalScans').textContent = scans.length;

      const average =
        scans.length
          ? Math.round(
              scans.reduce((sum, scan) => sum + (scan.score || 0), 0) /
              scans.length
            )
          : 0;

      const issues =
        scans.reduce(
          (sum, scan) => sum + (scan.violations_count || 0),
          0
        );

      document.getElementById('averageScore').textContent =
        scans.length ? average : '—';

      document.getElementById('totalIssues').textContent = issues;

      const body = document.getElementById('scanBody');
      body.innerHTML = '';

      if (!scans.length) {
        loading.style.display = 'none';
        empty.style.display = 'block';
        return;
      }

      scans.forEach(scan => {
        const row = document.createElement('tr');

        row.innerHTML = `
          <td>
            <div class="url" title="${escapeHtml(scan.url)}">
              ${escapeHtml(scan.url)}
            </div>
          </td>

          <td>
            <span class="score">${scan.score}/100</span>
          </td>

          <td>${scan.violations_count}</td>

          <td>${formatDate(scan.created_at)}</td>

          <td>
            <button
              class="view-btn"
              onclick="openReport('${scan.id}')">
              View
            </button>
          </td>
        `;

        body.appendChild(row);
      });

      loading.style.display = 'none';
      table.style.display = 'table';

    } catch (error) {
      loading.style.display = 'none';
      showError(error.message);
    }
  }

  async function openReport(id) {
    clearError();

    try {
      const response = await apiRequest(`/api/scans/${id}`);
      const data = await response.json();

      if (!response.ok) {
        throw new Error(data.error || 'Could not load report.');
      }

      document.getElementById('reportUrl').textContent = data.url;
      document.getElementById('reportScore').textContent =
        `${data.score}/100`;

      const container = document.getElementById('reportIssues');
      container.innerHTML = '';

      const violations = data.results?.violations || [];

      if (!violations.length) {
        container.innerHTML = `
          <div class="empty">
            No accessibility violations found.
          </div>
        `;
      } else {
        violations.forEach(v => {
          const issue = document.createElement('div');
          issue.className = 'issue';

          issue.innerHTML = `
            <div class="issue-title">${escapeHtml(v.help)}</div>
            <div class="issue-impact">
              Impact: ${escapeHtml(v.impact || 'unknown')}
              · ${v.nodes?.length || 0} element(s)
            </div>
            <div class="issue-description">
              ${escapeHtml(v.description || '')}
            </div>
          `;

          container.appendChild(issue);
        });
      }

      document.getElementById('modal').classList.add('active');

    } catch (error) {
      showError(error.message);
    }
  }

  function escapeHtml(value) {
    return String(value ?? '')
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#039;');
  }

  document.getElementById('closeModal').addEventListener('click', () => {
    document.getElementById('modal').classList.remove('active');
  });

  document.getElementById('modal').addEventListener('click', (event) => {
    if (event.target.id === 'modal') {
      document.getElementById('modal').classList.remove('active');
    }
  });

  document.getElementById('refreshBtn').addEventListener('click', loadScans);

  document.getElementById('logoutBtn').addEventListener('click', async () => {
    const client = authData.client;

    await client.auth.signOut();

    window.location.href = '/login.html';
  });

  async function init() {
    try {
      authData = await requireAuthOrRedirect();

      if (!authData) return;

      const { session } = authData;

      document.getElementById('userEmail').textContent =
        session.user.email || '';

      await loadScans();

    } catch (error) {
      console.error(error);
      showError(error.message);
    }
  }

  init();
</script>

</body>
</html>
