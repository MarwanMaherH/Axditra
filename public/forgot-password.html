<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset password — Axditra</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --ink: #0B0C0E;
      --charcoal: #17191D;
      --steel: #7D8890;
      --bone: #F3F4F1;
      --gold: #D9A25C;
      --critical: #E28C8C;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--ink);
      color: var(--bone);
      font-family: 'Inter', sans-serif;
    }

    .card {
      width: 100%;
      max-width: 380px;
    }

    .logo {
      text-align: center;
      font-family: 'Fraunces', serif;
      font-size: 22px;
      font-weight: 600;
      margin-bottom: 32px;
    }

    h1 {
      font-family: 'Fraunces', serif;
      font-size: 28px;
      font-weight: 500;
      text-align: center;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: var(--steel);
      font-size: 14px;
      margin-bottom: 30px;
      line-height: 1.5;
    }

    label {
      display: block;
      color: var(--steel);
      font-size: 12px;
      margin-bottom: 7px;
    }

    input {
      width: 100%;
      padding: 13px;
      margin-bottom: 18px;
      border: 1px solid rgba(125,136,144,.2);
      border-radius: 5px;
      outline: none;
      background: var(--charcoal);
      color: var(--bone);
      font-size: 14px;
    }

    input:focus {
      border-color: var(--gold);
    }

    button {
      width: 100%;
      padding: 13px;
      border: 0;
      border-radius: 5px;
      background: var(--gold);
      color: var(--ink);
      font-weight: 600;
      cursor: pointer;
    }

    button:disabled {
      opacity: .6;
      cursor: wait;
    }

    .message {
      display: none;
      margin-bottom: 18px;
      padding: 12px;
      border-radius: 5px;
      font-size: 13px;
      line-height: 1.5;
    }

    .message.show {
      display: block;
    }

    .error {
      color: var(--critical);
      background: rgba(226,140,140,.1);
      border: 1px solid rgba(226,140,140,.25);
    }

    .success {
      color: var(--gold);
      background: rgba(217,162,92,.1);
      border: 1px solid rgba(217,162,92,.25);
    }

    .links {
      margin-top: 20px;
      text-align: center;
      font-size: 13px;
      color: var(--steel);
    }

    .links a {
      color: var(--gold);
      text-decoration: none;
    }
  </style>
</head>

<body>

<div class="card">

  <div class="logo">Axditra</div>

  <h1>Reset your password</h1>

  <p class="subtitle">
    Enter your email and we'll send you a password reset link.
  </p>

  <div id="error" class="message error"></div>
  <div id="success" class="message success"></div>

  <form id="form">

    <label for="email">Email</label>

    <input
      id="email"
      type="email"
      autocomplete="email"
      required
    >

    <button id="submitBtn" type="submit">
      Send reset link
    </button>

  </form>

  <div class="links">
    <a href="/login.html">Back to sign in</a>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/js/supabase-client.js"></script>

<script>
  const form = document.getElementById('form');
  const emailInput = document.getElementById('email');
  const submitBtn = document.getElementById('submitBtn');
  const errorBox = document.getElementById('error');
  const successBox = document.getElementById('success');

  form.addEventListener('submit', async (event) => {
    event.preventDefault();

    errorBox.classList.remove('show');
    successBox.classList.remove('show');

    const email = emailInput.value.trim();

    if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
      errorBox.textContent = 'Please enter a valid email address.';
      errorBox.classList.add('show');
      return;
    }

    submitBtn.disabled = true;
    submitBtn.textContent = 'Sending...';

    try {
      const client = await getSupabaseClient();

      const { error } = await client.auth.resetPasswordForEmail(
        email,
        {
          redirectTo:
            `${window.location.origin}/reset-password.html`
        }
      );

      if (error) {
        throw error;
      }

      successBox.textContent =
        'If an account exists for this email, a password reset link has been sent.';

      successBox.classList.add('show');

      form.style.display = 'none';

    } catch (error) {
      errorBox.textContent =
        'Could not send the reset email. Please try again.';

      errorBox.classList.add('show');

      submitBtn.disabled = false;
      submitBtn.textContent = 'Send reset link';
    }
  });
</script>

</body>
</html>
