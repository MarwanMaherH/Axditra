<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Set new password — Axditra</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230B0C0E'/%3E%3Ccircle cx='16' cy='16' r='11' fill='none' stroke='%23F3F4F1' stroke-width='2.2'/%3E%3Cpath d='M11.3 16.5 L14.5 19.7 L20.7 11.3' fill='none' stroke='%23D9A25C' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round'/%3E%3Ccircle cx='25.5' cy='9.8' r='2' fill='%23D9A25C'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --ink: #0B0C0E; --charcoal: #17191D; --steel: #7D8890; --bone: #F3F4F1; --gold: #D9A25C;
      --line: rgba(125,136,144,0.18);
      --font-display: 'Fraunces', serif; --font-body: 'Inter', sans-serif;
      --critical: #E28C8C;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: var(--ink); color: var(--bone); font-family: var(--font-body); padding: 24px;
    }
    .card { width: 100%; max-width: 380px; }
    .logo {
      text-align: center; font-family: var(--font-display); font-size: 20px; font-weight: 600;
      margin-bottom: 32px; display: flex; align-items: center; justify-content: center; gap: 8px;
    }
    .logo svg { width: 22px; height: 22px; }
    h1 { font-family: var(--font-display); font-size: 26px; font-weight: 500; text-align: center; margin-bottom: 8px; }
    p.subtitle { color: var(--steel); text-align: center; line-height: 1.5; margin: 0 0 30px; font-size: 14px; }

    label { display: block; color: var(--steel); font-size: 12px; margin-bottom: 7px; }
    input {
      width: 100%; box-sizing: border-box; padding: 13px; margin-bottom: 18px;
      background: var(--charcoal); border: 1px solid var(--line); border-radius: 5px;
      color: var(--bone); font-family: var(--font-body); font-size: 14px; outline: none;
      transition: border-color 0.15s ease;
    }
    input:focus { border-color: var(--gold); }

    button {
      width: 100%; padding: 13px; border: 0; border-radius: 5px;
      background: var(--gold); color: var(--ink); font-weight: 600; font-family: var(--font-body);
      font-size: 14px; cursor: pointer; transition: background 0.15s ease, opacity 0.15s ease;
    }
    button:hover { background: #e5ae68; }
    button:disabled { opacity: .6; cursor: wait; }

    .message { display: none; padding: 12px; margin-bottom: 18px; border-radius: 5px; font-size: 13px; line-height: 1.5; }
    .message.show { display: block; }
    .error { color: var(--critical); background: rgba(226,140,140,.1); border: 1px solid rgba(226,140,140,.25); }
    .success { color: var(--gold); background: rgba(217,162,92,.1); border: 1px solid rgba(217,162,92,.25); }

    a:focus-visible, button:focus-visible, input:focus-visible {
      outline: 2px solid var(--gold);
      outline-offset: 2px;
    }
  </style>
</head>

<body>

<div class="card">

  <div class="logo">
    <svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><circle cx="16" cy="16" r="12" fill="none" stroke="#F3F4F1" stroke-width="2.2"/><path d="M11 16.5 L14.5 20 L21 11" fill="none" stroke="#D9A25C" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="26.4" cy="10" r="2" fill="#D9A25C"/></svg>
    Axditra
  </div>

  <h1>Set a new password</h1>
  <p class="subtitle">Choose a new password for your Axditra account.</p>

  <div id="message" class="message"></div>

  <form id="form">
    <label for="password">New password</label>
    <input id="password" type="password" minlength="8" autocomplete="new-password" required aria-describedby="message">

    <label for="confirm">Confirm password</label>
    <input id="confirm" type="password" minlength="8" autocomplete="new-password" required aria-describedby="message">

    <button id="button" type="submit">Update password</button>
  </form>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/js/supabase-client.js"></script>

<script>
  const form = document.getElementById('form');
  const password = document.getElementById('password');
  const confirm = document.getElementById('confirm');
  const button = document.getElementById('button');
  const message = document.getElementById('message');

  function showMessage(text, type) {
    message.textContent = text;
    message.className = `message show ${type}`;
  }

  async function init() {
    try {
      const client = await getSupabaseClient();
      const { data: { session }, error } = await client.auth.getSession();
      if (error) throw error;

      if (!session) {
        showMessage('This reset link is invalid or has expired. Please request a new one.', 'error');
        form.style.display = 'none';
        return;
      }
      form.style.display = '';
    } catch (error) {
      console.error('Password reset initialization failed:', error);
      showMessage('This reset link is invalid or has expired. Please request a new one.', 'error');
      form.style.display = 'none';
    }
  }

  form.addEventListener('submit', async (event) => {
    event.preventDefault();
    message.className = 'message';

    if (password.value.length < 8) {
      showMessage('Password must be at least 8 characters.', 'error');
      return;
    }
    if (password.value !== confirm.value) {
      showMessage('Passwords do not match.', 'error');
      return;
    }

    button.disabled = true;
    button.textContent = 'Updating...';

    try {
      const client = await getSupabaseClient();
      const { error } = await client.auth.updateUser({ password: password.value });
      if (error) throw error;

      showMessage('Password updated successfully. Redirecting to sign in...', 'success');
      form.style.display = 'none';
      setTimeout(() => { window.location.href = '/login.html'; }, 1800);
    } catch (error) {
      console.error('Password update failed:', error);
      showMessage(error.message || 'Could not update password.', 'error');
      button.disabled = false;
      button.textContent = 'Update password';
    }
  });

  init();
</script>

</body>
</html>
