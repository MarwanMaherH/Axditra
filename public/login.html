<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign in — Axditra</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230B0C0E'/%3E%3Ccircle cx='16' cy='16' r='11' fill='none' stroke='%23F3F4F1' stroke-width='2.2'/%3E%3Cpath d='M11.3 16.5 L14.5 19.7 L20.7 11.3' fill='none' stroke='%23D9A25C' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round'/%3E%3Ccircle cx='25.5' cy='9.8' r='2' fill='%23D9A25C'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,400&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
  :root {
    --ink: #0B0C0E; --charcoal: #17191D; --steel: #7D8890; --bone: #F3F4F1; --gold: #D9A25C;
    --line: rgba(125,136,144,0.18);
    --font-display: 'Fraunces', serif; --font-body: 'Inter', sans-serif; --font-mono: 'IBM Plex Mono', monospace;
    --critical: #E28C8C;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--ink); color: var(--bone); font-family: var(--font-body);
    min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px;
  }
  .card { width: 100%; max-width: 380px; }
  .logo { display: flex; align-items: center; gap: 8px; justify-content: center; margin-bottom: 32px; font-family: var(--font-display); font-size: 20px; font-weight: 600; }
  .logo svg { width: 24px; height: 24px; }
  h1 { font-family: var(--font-display); font-weight: 500; font-size: 26px; text-align: center; margin-bottom: 8px; }
  .subtitle { text-align: center; color: var(--steel); font-size: 14px; margin-bottom: 32px; }
  label { display: block; font-family: var(--font-mono); font-size: 12px; color: var(--steel); margin-bottom: 6px; }
  input {
    width: 100%; background: var(--charcoal); border: 1px solid var(--line); border-radius: 4px;
    padding: 12px 14px; color: var(--bone); font-family: var(--font-body); font-size: 14px; outline: none;
    margin-bottom: 18px; transition: border-color 0.15s ease;
  }
  input:focus { border-color: var(--gold); }
  .field-error { display: none; color: var(--critical); font-size: 12px; margin-top: -12px; margin-bottom: 16px; }
  .field-error.show { display: block; }
  button[type="submit"] {
    width: 100%; background: var(--gold); color: var(--ink); border: none; border-radius: 4px;
    padding: 13px; font-family: var(--font-body); font-weight: 600; font-size: 14px; cursor: pointer;
    transition: background 0.15s ease, opacity 0.15s ease;
  }
  button[type="submit"]:hover { background: #e5ae68; }
  button[type="submit"]:disabled { opacity: 0.6; cursor: wait; }
  .form-error {
    display: none; background: rgba(226,140,140,0.1); border: 1px solid rgba(226,140,140,0.3);
    color: var(--critical); font-size: 13px; padding: 10px 14px; border-radius: 4px; margin-bottom: 18px;
  }
  .form-error.show { display: block; }
  .links { text-align: center; margin-top: 20px; font-size: 13px; color: var(--steel); }
  .links a { color: var(--gold); text-decoration: none; }
  .links a:hover { text-decoration: underline; }
  .forgot { text-align: right; margin-top: -12px; margin-bottom: 18px; }
  .forgot a { font-size: 12.5px; color: var(--steel); text-decoration: none; }
  .forgot a:hover { color: var(--bone); }
</style>
</head>
<body>

<div class="card">
  <div class="logo">
    <svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg"><circle cx="16" cy="16" r="12" fill="none" stroke="#F3F4F1" stroke-width="2.2"/><path d="M11 16.5 L14.5 20 L21 11" fill="none" stroke="#D9A25C" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="26.4" cy="10" r="2" fill="#D9A25C"/></svg>
    Axditra
  </div>
  <h1>Welcome back</h1>
  <p class="subtitle">Sign in to see your scan history.</p>

  <div class="form-error" id="formError"></div>

  <form id="loginForm" novalidate>
    <label for="email">Email</label>
    <input type="email" id="email" autocomplete="email" required>
    <div class="field-error" id="emailError">Please enter a valid email.</div>

    <label for="password">Password</label>
    <input type="password" id="password" autocomplete="current-password" required>
    <div class="field-error" id="passwordError">Password is required.</div>

    <div class="forgot"><a href="/forgot-password.html">Forgot password?</a></div>

    <button type="submit" id="submitBtn">Sign in</button>
  </form>

  <div class="links">Don't have an account? <a href="/signup.html">Create one</a></div>
</div>

<script src="/js/supabase-client.js"></script>
<script>
  const form = document.getElementById('loginForm');
  const submitBtn = document.getElementById('submitBtn');
  const formError = document.getElementById('formError');
  const emailInput = document.getElementById('email');
  const passwordInput = document.getElementById('password');
  const emailError = document.getElementById('emailError');
  const passwordError = document.getElementById('passwordError');

  // If already signed in, skip straight to the dashboard.
  (async () => {
    const client = await getSupabaseClient();
    const { data: { session } } = await client.auth.getSession();
    if (session) window.location.href = '/dashboard.html';
  })();

  function friendlyError(message) {
    if (/invalid login credentials/i.test(message)) return 'Invalid email or password.';
    if (/email not confirmed/i.test(message)) return 'Please confirm your email before signing in.';
    return 'Something went wrong. Please try again.';
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    formError.classList.remove('show');
    emailError.classList.remove('show');
    passwordError.classList.remove('show');

    const email = emailInput.value.trim();
    const password = passwordInput.value;
    let hasError = false;

    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
      emailError.classList.add('show');
      hasError = true;
    }
    if (!password) {
      passwordError.classList.add('show');
      hasError = true;
    }
    if (hasError) return;

    submitBtn.disabled = true;
    submitBtn.textContent = 'Signing you in…';

    try {
      const client = await getSupabaseClient();
      const { error } = await client.auth.signInWithPassword({ email, password });
      if (error) throw error;
      window.location.href = '/dashboard.html';
    } catch (err) {
      formError.textContent = friendlyError(err.message || '');
      formError.classList.add('show');
      submitBtn.disabled = false;
      submitBtn.textContent = 'Sign in';
    }
  });
</script>

</body>
</html>
